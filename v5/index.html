<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GODDESS 創世の書</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btn-left" class="icon-btn only-sp" aria-label="一覧">☰</button>
    <div class="brand">GODDESS<small>創世の書</small></div>
    <div class="stat date"><b id="t-date">—</b><small id="t-season">—</small></div>
    <div class="stat power" title="神力: 介入に使う力。信仰から毎月たまる"><span>神力</span><b id="t-power">0</b><small id="t-inc">+0/月</small></div>
    <div class="stat faith fh" title="人族の信仰"><span>人族の信仰</span><b id="t-fh">0</b></div>
    <div class="stat faith fd" title="魔族の信仰"><span>魔族の信仰</span><b id="t-fd">0</b></div>
    <div class="stat pop only-pc" title="世界の人口"><span>世界人口</span><b id="t-pop">0</b></div>
    <div id="speed" role="group" aria-label="時間の速さ">
      <button data-sp="0" title="止める">❚❚</button>
      <button data-sp="1" title="ふつう">▶</button>
      <button data-sp="2" title="はやい">▶▶</button>
      <button data-sp="3" title="とてもはやい">▶▶▶</button>
    </div>
    <button id="btn-menu" class="icon-btn" aria-label="メニュー">⚙</button>
  </header>

  <aside id="left" class="panel">
    <nav id="tabs">
      <button data-tab="nations">国家</button><button data-tab="people">人物</button><button data-tab="cities">都市</button><button data-tab="wars">戦争</button><button data-tab="history">歴史</button><button data-tab="plans">計画</button>
    </nav>
    <div id="list" class="scroll"></div>
  </aside>

  <main id="mapwrap">
    <canvas id="map"></canvas>
    <div id="banner"></div>
    <div id="feed"><div id="warline"></div><div id="feed-list"></div></div>
    <div id="picker"><span id="picker-text"></span><button id="picker-cancel">やめる</button></div>
    <div id="zoom"><button data-z="in">＋</button><button data-z="out">－</button><button data-z="fit">⌂</button></div>
    <div id="legend" class="only-pc"><span class="lg h">人族の国</span><span class="lg d">魔族の国</span><span class="lg w">戦争中の国境</span></div>
  </main>

  <aside id="right" class="panel">
    <button id="right-close" class="icon-btn only-sp" aria-label="閉じる">✕</button>
    <div id="detail" class="scroll"></div>
  </aside>

  <footer id="bottom">
    <div id="spot-wrap"><div class="spot-head">いま注目の出来事</div><div id="spot"></div></div>
    <div id="news-wrap">
      <div id="news-filter"><button data-f="" class="on">すべて</button><button data-f="war">戦争</button><button data-f="person">人物</button><button data-f="politics">国</button><button data-f="goddess">女神</button></div>
      <div id="news" class="scroll"></div>
    </div>
  </footer>

  <div id="toast"></div>
  <div id="modal" class="hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="battle" class="hidden"></div>
  <div id="coach" class="hidden"><div id="coach-hole"></div><div id="coach-box"></div></div>

  <div id="title">
    <div class="title-bg"></div>
    <div class="title-inner">
      <h1>GODDESS<span>創世の書</span></h1>
      <p class="lead">あなたは、この世界を創った女神アステリア。<br>人族も魔族も、あなたを信じて祈っている。<br>――けれど本当は、両者の争いを生んでいるのも、あなた。</p>
      <div class="title-btns">
        <button id="btn-new" class="big">はじめから</button>
        <button id="btn-continue" class="big ghost">つづきから</button>
      </div>
      <details class="seed"><summary>世界の種(シード)を決める</summary><input id="seed" placeholder="空なら毎回ちがう世界" maxlength="20"></details>
      <p class="small">住民は、あなたの正体を知らない。知るのは、あなただけ。</p>
    </div>
  </div>
</div>
<script src="js/rng.js"></script>
<script src="js/data.js"></script>
<script src="js/terrain.js"></script>
<script src="js/map.js"></script>
<script src="js/core.js"></script>
<script src="js/people.js"></script>
<script src="js/world.js"></script>
<script src="js/nations.js"></script>
<script src="js/war.js"></script>
<script src="js/story.js"></script>
<script src="js/goddess.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/battleview.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
